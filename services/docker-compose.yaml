services:
  # ========== ПРИЛОЖЕНИЯ ==========
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    environment:
      - HTTP_PORT=:8082
      - SHORTENER_URL=http://shortener:8080
      - AUTH_GRPC_ADDR=auth:50051
      - AUTH_HTTP_URL=http://auth:8080
      - REDIS_ADDR=redis:6379
    ports:
      - "8082:8082" # единственный вход для клиентов
    depends_on:
      auth:
        condition: service_started
      shortener:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app-network

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - GRPC_PORT=:50051
      - HTTP_PORT=:8080
      - HTTP_METRICS_PORT=:9090
      - DATABASE_URL=postgres://postgres:postgres@auth-db:5432/auth?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=168h
    ports:
      - "9091:9090" # метрики
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network

  shortener:
    build:
      context: ./shortener
      dockerfile: Dockerfile
    container_name: shortener-service
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/url_shortener?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - HTTP_ADDR=:8080
      - BASE_URL=http://localhost:8082/r
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app-network

  billing:
    build:
      context: ./billing
      dockerfile: Dockerfile
    container_name: billing-service
    environment:
      - DATABASE_URL=postgres://postgres:postgres@billing-db:5432/billing?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - REQUESTS_CONSUMER_GROUP=billing-requests-group
      - CONFIRMATIONS_CONSUMER_GROUP=billing-confirmations-group
      - HTTP_PORT=:8084
    ports:
      - "8085:8084" # метрики и health
    depends_on:
      billing-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network

  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=url-events
      - KAFKA_GROUP_ID=notifications-group
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:9999/webhook}
      - NOTIFY_THRESHOLD=1000
      - HTTP_PORT=:8086
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=url-events
      - KAFKA_GROUP_ID=analytics-group
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse123
      - HTTP_PORT=:8082
    ports:
      - "8083:8082" # метрики и health
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - app-network

  # ========== БАЗЫ И ИНФРАСТРУКТУРА ==========
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shortener/migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./auth/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  billing-db:
    image: postgres:16-alpine
    container_name: billing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    ports:
      - "5434:5432"
    volumes:
      - billing-db-data:/var/lib/postgresql/data
      - ./billing/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: url_shortener_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: url_shortener_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: url_shortener_clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse123
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./analytics/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 127.0.0.1 вместо localhost: localhost может резолвиться в IPv6
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: url_shortener_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./shortener/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: url_shortener_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  pgdata:
  auth-db-data:
  billing-db-data:
  clickhouse_data:

networks:
  app-network:
    driver: bridge