global:
  scrape_interval: 5s

scrape_configs:
  - job_name: shortener
    static_configs:
      - targets: ["shortener:8080"]
  - job_name: auth
    static_configs:
      - targets: ["auth:9090"]
  - job_name: billing
    static_configs:
      - targets: ["billing:8084"]
  - job_name: analytics
    static_configs:
      - targets: ["analytics:8082"]
  - job_name: notification
    static_configs:
      - targets: ["notification:8086"]