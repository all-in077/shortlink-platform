apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: shortener
data:
  GRPC_PORT: ":50051"
  HTTP_PORT: ":8080"
  HTTP_METRICS_PORT: ":9090"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "168h"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: shortener
data:
  HTTP_PORT: ":8084"
  KAFKA_BROKERS: "kafka:29092"
  REQUESTS_CONSUMER_GROUP: "billing-requests-group"
  CONFIRMATIONS_CONSUMER_GROUP: "billing-confirmations-group"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortener-config
  namespace: shortener
data:
  HTTP_ADDR: ":8080"
  REDIS_ADDR: "redis:6379"
  KAFKA_BROKERS: "kafka:29092"
  BASE_URL: "http://localhost:8082/r"
  SAGA_CONSUMER_GROUP: "shortener-saga-group"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: shortener
data:
  HTTP_PORT: ":8082"
  SHORTENER_URL: "http://shortener:8080"
  AUTH_GRPC_ADDR: "auth:50051"
  AUTH_HTTP_URL: "http://auth:8080"
  REDIS_ADDR: "redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: shortener
data:
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_TOPIC: "url-events"
  KAFKA_GROUP_ID: "notifications-group"
  WEBHOOK_URL: "http://localhost:9999/webhook"
  NOTIFY_THRESHOLD: "1000"
  HTTP_PORT: ":8086"
