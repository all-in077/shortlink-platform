apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shortener
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: gateway
          image: shortener/gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
