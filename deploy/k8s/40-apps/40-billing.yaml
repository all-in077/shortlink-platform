apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      enableServiceLinks: false
      containers:
        - name: billing
          image: shortener/billing:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
