apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      enableServiceLinks: false
      containers:
        - name: notification
          image: shortener/notification:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: notification-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8086
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi